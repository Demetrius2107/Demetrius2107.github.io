# ====================== 基础站点配置（必改） ======================
baseURL = "https://demetrius2107.github.io/"  # 你的GitHub Pages域名
languageCode = "zh-CN"
locale = "zh-CN"
title = "Demetrius' Blog"                    # 🔥 修复：双引号+无转义
theme = "FixIt"                              # 启用FixIt主题
author = "Demetrius"
copyright = "Copyright © 2026 Demetrius"
enableRobotsTXT = true

# ====================== FixIt 主题核心配置 ======================
[params]
  subtitle = "Stay hungry, stay foolish"
  description = "Personal blog of Demetrius"
  logo = "/images/logo.png"
  favicon = "/favicon.ico"

  # 站点级默认分享图（Open Graph / Twitter Card），文章 featuredImage 会覆盖
  images = ["/images/logo.png"]

  defaultTheme = "auto"
  enableDarkMode = true
  enableThemeChange = true

  enableSearch = true
  enableCodeCopy = true
  enableToc = true
  enableLazyLoad = true
  enableScrollToTop = true

  contentOverflow = true
  summaryLength = 150
  paginate = 10

# ====================== 站内搜索（fuse 本地索引） ======================
[params.search]
  enable = true
  type = "fuse"
  contentLength = 4000
  placeholder = "搜索文章…"
  maxResultLength = 10
  snippetLength = 50
  highlightTag = "em"
  absoluteURL = false
  anchorify = true

[params.search.fuse]
  isCaseSensitive = false
  minMatchCharLength = 2
  findAllMatches = false
  location = 0
  threshold = 0.3
  distance = 100
  ignoreLocation = false
  useExtendedSearch = false
  ignoreFieldNorm = false

# ====================== 首页个人档案 ======================
[params.home.profile]
  enable = true
  onlyFirstPage = true
  avatarURL = "/images/logo.png"
  title = "Demetrius"
  subtitle = "Stay hungry, stay foolish"
  typeit = true
  social = true

# ====================== 首页文章列表 ======================
[params.home.posts]
  enable = true
  paginate = 6

# ====================== 顶部加载进度条 ======================
[params.pace]
  enable = true
  color = "blue"
  theme = "minimal"

# ====================== 标签云 ======================
[params.tagcloud]
  enable = true
  min = 14
  max = 32
  peakCount = 10
  orderby = "name"

# ====================== 顶部导航菜单 ======================
[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 2

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 3

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 4

# ====================== 社交链接 ======================
[params.social]
  GitHub = "Demetrius2107"
  Email = ""

# ====================== 首页额外区块 ======================
[params.home.about]
  enable = true
  content = "热爱编程与技术的 Demetrius，专注于 Java、Python、Go 语言的学习与实践，记录技术成长路上的思考与收获。Stay hungry, stay foolish。"

[params.home.skills]
  enable = true
  groups = [
    { title = "编程语言", items = ["Java", "Python", "Go", "SQL"] },
    { title = "后端开发", items = ["Spring Boot", "微服务", "RESTful API", "MyBatis"] },
    { title = "工具链", items = ["Git", "Docker", "Hugo", "Linux"] },
    { title = "前端", items = ["HTML", "CSS", "JavaScript"] },
  ]

# ====================== 页脚配置 ======================
[params.footer]
  since = 2026
  license = "君问归期未有期，巴山夜雨涨秋池"  # 替换默认的“Hugo 强力驱动|主题 FixIt”

  [params.footer.powered]
    enable = false  # 关闭 “Hugo 强力驱动 | 主题 - FixIt” 那一行

# ====================== 作者信息 ======================
[params.author]
  name = "Demetrius"
  link = "/"

# ====================== 代码高亮配置 ======================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # 允许正文内嵌 HTML（旧文章迁移自 Hexo HTML）
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true

# ====================== Front Matter：lastmod 自动取 git 修改时间 ======================
[frontmatter]
  lastmod = ['lastmod', ':git', 'date']

# ====================== 相关文章匹配规则 ======================
[related]
  threshold = 80
  includeNewer = true
  toLower = false
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'categories'
    weight = 80

# ====================== 自定义 partial 注入 ======================
# FOUC 修复：在 <head> 内联读取 localStorage 配色，避免首屏闪烁
[params.customPartials]
head = ["custom/fouc.html"]

# ====================== 输出格式（显式开启 search 索引） ======================
[outputs]
home = ["html", "rss", "archives", "search"]
section = ["html", "rss"]
taxonomy = ["html"]
term = ["html", "rss"]

# ====================== 文章页功能增强 ======================
[params.page]
  pageStyle = "wide"

  # 阅读时长、字数、访问统计
  readingTime = true
  wordCount = true

  # 图片灯箱：点击图片放大查看
  lightgallery = "force"

  # 文章过期提醒（技术博客实用）
  [params.page.outdatedArticleReminder]
    enable = true
    hint = 365  # 超过 365 天的文章显示"可能已过时"提示

  # 相关文章推荐
  [params.page.related]
    enable = true
    count = 5

  # 评论系统：Giscus（基于 GitHub Discussions）
  [params.page.comment]
    enable = true
    [params.page.comment.giscus]
      enable = true
      # ⚠️ 以下两项需你去 https://giscus.app 获取后替换
      repo = "Demetrius2107/Demetrius2107.github.io"
      repoId = ""          # TODO: 去 giscus.app 生成，填入 data-repo-id
      category = "Announcements"
      categoryId = ""      # TODO: 去 giscus.app 生成，填入 data-category-id
      mapping = "pathname"
      strict = "0"
      term = ""
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "bottom"
      lang = "zh-CN"
      lightTheme = "light"
      darkTheme = "dark"
      lazyLoad = true